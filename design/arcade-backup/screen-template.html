<template id="screen-template">
  <div class="screen-inner">
    <div id="view-boot" class="view active">
      <div class="boot-msgs"></div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
      <div class="press-start">PRESS START</div>
    </div>
    <div id="view-menu" class="view">
      <div class="menu-head">
        <div class="menu-title">SELECT // WEAPON</div>
        <div class="menu-hud"><div>P1: <span class="val">TYLER</span></div><div>×<span class="credit-blink">∞</span></div></div>
      </div>
      <div class="menu-body">
        <div class="cart-grid"></div>
        <div class="preview">
          <div class="preview-title">—</div><div class="preview-desc">—</div>
          <div class="preview-meta"></div>
          <div class="preview-press">▶ PRESS A TO EQUIP</div>
        </div>
      </div>
    </div>
    <div id="view-detail" class="view">
      <div class="detail-head"><button class="back-btn">◀ BACK</button><div class="detail-title">—</div></div>
      <div class="detail-body"></div>
    </div>
    <div class="flash"></div>
  </div>
</template>
