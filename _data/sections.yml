# Source of truth for Game Boy cartridge / section selector.
# Each entry maps to a real static URL. Order field controls game-select layout.
# Optional PixelLab cartridge sticker art, if you want to add a simple concept mark later:
#   pixel_art: /assets/img/pixel/cartridges/<section-id>.png
# If pixel_art is omitted, the cartridge uses a clean color-only label.

- id: blog
  order: 1
  label: "Blog"
  title: PLAYING WITH PACKETS
  sub: BLOG
  desc: "detection writeups, adversary infra research, threat hunting."
  meta:
    - [TYPE, BLOG]
    - [BY, iimp0ster]
  color: "#ffd23a"
  letter: B
  pixel_art: /assets/img/pixel/cartridges/blog.png
  route: /blog/
  external: false

- id: chokepoints
  order: 2
  label: "Chokepoints"
  title: DETECTION CHOKEPOINTS
  sub: EXTERNAL SITE
  desc: "Detection is a game of economics, make it expensive for attackers."
  meta:
    - [TYPE, EXTERNAL]
    - [FOCUS, CHOKEPOINTS]
  color: "#ff8c1a"
  letter: C
  pixel_art: /assets/img/pixel/cartridges/chokepoints.png
  route: https://iimp0ster.github.io/detection-chokepoints/
  external: true

- id: archive
  order: 3
  label: "Archive"
  title: SIGNAL ARCHIVE
  sub: ARCHIVE
  desc: "legacy posts from the old blog."
  meta:
    - [TYPE, ARCHIVE]
    - [ERA, EARLY POSTS]
  color: "#6a8caf"
  letter: A
  pixel_art: /assets/img/pixel/cartridges/archive.png
  route: /archive/
  external: false

- id: about
  order: 4
  label: "About"
  title: ABOUT
  sub: PLAYER 1
  desc: "threat research."
  meta:
    - [ORG, HUNTRESS]
    - [ROLE, DETECTION ENG]
  color: "#4a9ec4"
  letter: P
  pixel_art: /assets/img/pixel/cartridges/about.png
  route: /about/
  external: false
