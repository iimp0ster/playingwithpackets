<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PWP // Metal Theme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Black+Ops+One&family=VT323&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Screen palette — warm Metal Slug tones */
  --bg-deep:#140a0a; --bg-screen:#1c1010; --bg-panel:#2a1614; --bg-panel-hi:#3a201c; --bg-darker:#0e0606;
  --ink:#f4e8d0; --ink-dim:#c8b598; --ink-faint:#8a6f5a;

  /* Re-skinned "neon" accents → Metal Slug */
  --neon-yellow:#ffd23a; --neon-pink:#e8352a; --neon-cyan:#ff8c1a; --neon-magenta:#d8488e;
  --neon-green:#8ab43a; --neon-red:#c8201c; --neon-orange:#ff8c1a;

  /* Game Boy shell (unchanged) */
  --gb-shell:#c3b5a8; --gb-shell-dark:#9c907f; --gb-shell-hi:#d8ccbe;
  --gb-screen-bezel:#3a3340; --gb-dpad:#2a2530; --gb-btn-purple:#6b3e8e;
  --gb-btn-red:#c33a4c; --gb-led-red:#ff3a3a;

  /* Metal Slug arcade chassis */
  --ms-red:#c8201c; --ms-red-dark:#7a1010; --ms-red-deep:#4a0808; --ms-red-bright:#e8352a;
  --ms-black:#160d0d; --ms-black-hi:#2a1614;
  --ms-yellow:#ffd23a; --ms-yellow-dark:#c89510;
  --ms-cream:#f4e8d0; --ms-white:#f0e8d8;

  --font-pixel:'Press Start 2P','Courier New',monospace;
  --font-stencil:'Black Ops One','Impact',sans-serif;
  --font-crt:'VT323','Courier New',monospace;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; }
body { background:#000; color:var(--ink); font-family:var(--font-crt);
  user-select:none; -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; justify-content:center; }
button { font-family:inherit; cursor:pointer; border:0; background:none; }
button:focus { outline:none; }

.device { width:100vw; height:100vh; height:100dvh; position:relative; }
.gb-shell,.arcade-shell { display:none; }

@media (max-width:719px) { body.auto .gb-shell { display:flex; } body.auto { background:#15101a; } }
@media (min-width:720px) { body.auto .arcade-shell { display:flex; } body.auto { background:#0a0606; } }
body.force-gb .gb-shell { display:flex; } body.force-gb { background:#15101a; } body.force-gb .arcade-shell { display:none !important; }
body.force-arcade .arcade-shell { display:flex; } body.force-arcade { background:#0a0606; } body.force-arcade .gb-shell { display:none !important; }

.shell-toggle {
  position:fixed; top:8px; right:8px; z-index:1000;
  background:rgba(0,0,0,.7); border:2px solid var(--ms-yellow); color:var(--ms-yellow);
  font-family:var(--font-pixel); font-size:.45rem; padding:6px 8px; letter-spacing:.08em;
}
.shell-toggle:hover { background:var(--ms-yellow); color:#000; }

.screen-inner { width:100%; height:100%; background:var(--bg-screen); position:relative; overflow:hidden; }
.screen-inner::before { content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(to bottom,transparent 0px,transparent 2px,rgba(255,255,255,.025) 2px,rgba(255,255,255,.025) 3px);
  pointer-events:none; z-index:50; }
.screen-inner::after { content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at center,transparent 0%,transparent 55%,rgba(0,0,0,.55) 100%);
  pointer-events:none; z-index:49; }

/* ============================================================
   GAME BOY SHELL (unchanged chassis)
   ============================================================ */
.gb-shell { width:100%; height:100%; flex-direction:column; align-items:center;
  background:radial-gradient(ellipse at center,var(--gb-shell-hi) 0%,var(--gb-shell) 50%,var(--gb-shell-dark) 100%);
  padding:14px 16px 16px; position:relative; }
.gb-shell::before { content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.15),transparent 30%),radial-gradient(circle at 80% 90%,rgba(0,0,0,.08),transparent 40%);
  pointer-events:none; }
.gb-top { width:100%; display:flex; justify-content:space-between; align-items:center;
  padding:4px 6px 8px; font-family:var(--font-pixel); font-size:.45rem;
  color:var(--gb-shell-dark); letter-spacing:.1em; text-transform:uppercase; z-index:1; }
.gb-top .left { color:#555; }
.gb-top .right { color:var(--gb-btn-purple); font-weight:bold; }
.gb-bezel { width:100%; flex:1; background:var(--gb-screen-bezel);
  border-radius:12px 12px 36px 12px; padding:16px 14px 28px; position:relative;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.05); z-index:1; }
.gb-led-row { position:absolute; top:24px; left:22px; display:flex; align-items:center; gap:6px;
  font-family:var(--font-pixel); font-size:.35rem; color:#888; letter-spacing:.08em; }
.gb-led { width:6px; height:6px; background:var(--gb-led-red); border-radius:50%; box-shadow:0 0 6px var(--gb-led-red); }
.gb-brand { position:absolute; top:22px; right:22px; font-family:var(--font-pixel); font-size:.4rem;
  color:#999; letter-spacing:.15em; font-style:italic; }
.gb-brand span { color:var(--gb-btn-purple); font-style:normal; }
.gb-screen { width:100%; height:100%; margin-top:18px; position:relative;
  background:#000; border:1px solid #1a1620; overflow:hidden; }
.gb-undertext { position:absolute; bottom:6px; left:0; right:0; text-align:center;
  font-family:var(--font-pixel); font-size:.35rem; color:#777; letter-spacing:.15em; }
.gb-deck { width:100%; display:grid; grid-template-columns:1fr 1fr; align-items:center;
  padding:14px 4px 0; gap:14px; z-index:1; }
.gb-dpad-wrap { width:96px; height:96px; position:relative; justify-self:start; margin-left:8px; }
.gb-dpad-cross { position:absolute; background:var(--gb-dpad);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.05),0 2px 4px rgba(0,0,0,.3); }
.gb-dpad-cross.h { top:36px; left:6px; width:84px; height:24px; border-radius:4px; }
.gb-dpad-cross.v { top:6px; left:36px; width:24px; height:84px; border-radius:4px; }
.gb-dpad-btn { position:absolute; width:32px; height:32px; background:transparent;
  color:rgba(255,255,255,.15); font-size:11px; z-index:2; transition:color 80ms; }
.gb-dpad-btn:active { color:rgba(255,255,255,.5); }
.gb-dpad-btn.up { top:0; left:32px; } .gb-dpad-btn.down { bottom:0; left:32px; }
.gb-dpad-btn.left { top:32px; left:0; } .gb-dpad-btn.right { top:32px; right:0; }
.gb-ab { display:flex; align-items:center; gap:12px; justify-self:end; transform:rotate(-22deg); margin-right:14px; }
.gb-btn-ab { width:48px; height:48px; border-radius:50%; background:var(--gb-btn-red);
  font-family:var(--font-pixel); font-size:.85rem; color:white;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.15),0 3px 5px rgba(0,0,0,.3);
  transition:transform 80ms; }
.gb-btn-ab:active { transform:translateY(2px); }
.gb-btn-label { font-family:var(--font-pixel); font-size:.4rem; color:var(--gb-shell-dark);
  text-align:center; margin-top:4px; letter-spacing:.1em; transform:rotate(0deg); }
.gb-ab-col { display:flex; flex-direction:column; align-items:center; transform:rotate(22deg); }
.gb-startsel { grid-column:1/-1; display:flex; justify-content:center; gap:24px; margin-top:6px; transform:rotate(-22deg); }
.gb-startsel-col { display:flex; flex-direction:column; align-items:center; transform:rotate(22deg); }
.gb-btn-pill { width:38px; height:11px; border-radius:6px; background:var(--gb-dpad);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05),0 2px 3px rgba(0,0,0,.25); }
.gb-btn-pill:active { transform:translateY(1px); }
.gb-speaker { position:absolute; bottom:18px; right:18px;
  display:grid; grid-template-columns:repeat(6,4px); gap:6px; transform:rotate(-22deg); pointer-events:none; }
.gb-speaker span { display:block; width:4px; height:22px; background:var(--gb-shell-dark); border-radius:2px;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.4); }

/* ============================================================
   METAL SLUG ARCADE CABINET
   ============================================================ */
.arcade-shell {
  width:100%; height:100%; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at bottom,#2a0c0a 0%,#0e0404 60%,#000 100%);
  padding:18px; position:relative;
}
.cabinet-wrap {
  width:100%; max-width:1080px; height:100%; max-height:920px;
  position:relative; display:flex; flex-direction:column;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.7));
}

/* Reusable comic war-art red background */
.comic-red {
  background:
    radial-gradient(circle at 12% 18%, var(--ms-red-deep) 0%, transparent 22%),
    radial-gradient(circle at 82% 30%, var(--ms-red-deep) 0%, transparent 26%),
    radial-gradient(circle at 65% 80%, var(--ms-red-dark) 0%, transparent 30%),
    radial-gradient(circle at 30% 70%, var(--ms-red-dark) 0%, transparent 28%),
    linear-gradient(160deg, var(--ms-red-bright) 0%, var(--ms-red) 45%, var(--ms-red-dark) 100%);
}

/* === MARQUEE HOOD === */
.cab-hood {
  height:100px; position:relative;
  display:flex; align-items:center; gap:14px;
  padding:12px 18px;
  border-radius:12px 12px 2px 2px;
  border:3px solid var(--ms-black);
  border-bottom:0;
  overflow:hidden;
}
.cab-speaker {
  width:64px; height:64px; flex:0 0 auto;
  border-radius:50%;
  background:var(--ms-black);
  box-shadow:inset 0 0 0 4px #2a1414, inset 0 3px 8px rgba(0,0,0,.7), 0 2px 4px rgba(0,0,0,.4);
  position:relative; overflow:hidden;
}
.cab-speaker::before {
  content:""; position:absolute; inset:8px; border-radius:50%;
  background-image:radial-gradient(circle, #3a1c1c 1px, transparent 1.6px);
  background-size:7px 7px;
}
.cab-marquee-plate {
  flex:1; height:100%;
  background:var(--ms-black);
  border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  box-shadow:inset 0 0 0 2px #2a1414;
}
.cab-marquee-plate::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 20% 40%, rgba(232,53,42,.4) 0%, transparent 30%),
    radial-gradient(circle at 75% 60%, rgba(255,140,26,.25) 0%, transparent 35%),
    linear-gradient(180deg, rgba(122,16,16,.5), transparent);
  pointer-events:none;
}
.cab-logo {
  font-family:var(--font-stencil);
  font-size:clamp(1.1rem,2.6vw,2rem);
  color:var(--ms-yellow);
  letter-spacing:0.04em;
  text-align:center; line-height:0.95;
  position:relative; z-index:1;
  transform:skew(-5deg);
  text-shadow:
    2px 2px 0 var(--ms-red-deep),
    3px 3px 0 var(--ms-black),
    0 0 18px rgba(255,210,58,.3);
  -webkit-text-stroke:1px var(--ms-red-dark);
}
.cab-logo small {
  display:block;
  font-family:var(--font-pixel);
  font-size:.4rem;
  color:var(--ms-cream);
  letter-spacing:.3em;
  -webkit-text-stroke:0;
  text-shadow:1px 1px 0 #000;
  margin-top:6px; transform:skew(5deg);
}

/* === BODY === */
.cab-body {
  flex:1; position:relative;
  border:3px solid var(--ms-black); border-top:0; border-bottom:0;
  padding:0;
  display:flex; flex-direction:column;
}
/* red header strip above screen */
.cab-screen-header {
  height:26px; flex:0 0 auto;
  border-bottom:3px solid var(--ms-black);
  position:relative; overflow:hidden;
}
.cab-screen-header::after {
  content:"★ INSERT COIN ★  1 CREDIT  ★";
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:var(--font-pixel); font-size:.5rem; color:var(--ms-yellow);
  letter-spacing:.15em; text-shadow:1px 1px 0 #000; white-space:nowrap;
}
.cab-screen-zone {
  flex:1; padding:16px; position:relative;
  display:flex;
}
.cab-screen-bezel {
  flex:1; background:var(--ms-black);
  border-radius:10px; padding:14px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.8), inset 0 -1px 0 #2a1414;
}
.cab-screen {
  width:100%; height:100%; background:var(--bg-screen);
  border-radius:5px; position:relative; overflow:hidden;
  box-shadow:inset 0 0 70px rgba(232,53,42,.08), inset 0 0 150px rgba(0,0,0,.85);
}

/* === CONTROL DECK === */
.cab-deck {
  height:140px; flex:0 0 auto; position:relative;
  border:3px solid var(--ms-black);
  overflow:hidden;
}
/* diagonal stripes band */
.cab-deck::before {
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(118deg,
    var(--ms-cream) 0 16px, var(--ms-red-bright) 16px 34px);
  opacity:.92;
}
.cab-deck::after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.2) 0%, transparent 30%, rgba(0,0,0,.35) 100%);
}
.cab-controls {
  position:absolute; inset:0;
  display:grid; grid-template-columns:1fr 2fr; align-items:center;
  padding:0 36px; gap:16px; z-index:2;
}
/* joystick */
.cab-joystick { position:relative; width:60px; height:64px; justify-self:start; margin-left:30px; pointer-events:none; }
.cab-joy-plate {
  position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  width:54px; height:54px; border-radius:50%;
  background:radial-gradient(circle at 50% 40%, #2a2028, #0e0a0e);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.1), 0 3px 6px rgba(0,0,0,.5);
}
.cab-joy-shaft {
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  width:8px; height:34px; background:linear-gradient(180deg,#4a4250,#1a1820); border-radius:4px;
  box-shadow:inset -1px 0 0 #5a5260, inset 1px 0 0 rgba(0,0,0,.4); }
.cab-joy-ball {
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:30px; height:30px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff8060 0%, var(--ms-red-bright) 40%, #7a1010 100%);
  box-shadow:inset -2px -3px 0 rgba(0,0,0,.3), 0 3px 6px rgba(0,0,0,.5); }
.cab-joy-ball::after { content:""; position:absolute; top:5px; left:7px; width:7px; height:4px; background:rgba(255,255,255,.55); border-radius:50%; }
/* buttons */
.cab-buttons { display:grid; grid-template-columns:repeat(3,40px); grid-template-rows:repeat(2,40px);
  gap:9px 11px; justify-content:center; align-content:center; justify-self:end; margin-right:18px; }
.cab-btn { width:40px; height:40px; border-radius:50%; position:relative;
  box-shadow:inset -2px -3px 0 rgba(0,0,0,.4), inset 2px 2px 0 rgba(255,255,255,.3), 0 3px 5px rgba(0,0,0,.5); }
.cab-btn::after { content:""; position:absolute; top:6px; left:9px; width:9px; height:5px; background:rgba(255,255,255,.55); border-radius:50%; }
.cab-btn.yellow { background:radial-gradient(circle at 35% 30%, #fff0a0 0%, var(--ms-yellow) 50%, var(--ms-yellow-dark) 100%); }
.cab-btn.red { background:radial-gradient(circle at 35% 30%, #ff8070 0%, var(--ms-red-bright) 50%, #7a1010 100%); }

/* === BASE === */
.cab-base {
  height:80px; flex:0 0 auto; position:relative;
  border:3px solid var(--ms-black); border-top:0;
  border-radius:0 0 8px 8px;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.cab-base-logo {
  font-family:var(--font-stencil); font-size:1.1rem; color:var(--ms-yellow);
  letter-spacing:.05em; transform:skew(-5deg);
  text-shadow:2px 2px 0 var(--ms-red-deep), 3px 3px 0 var(--ms-black);
  -webkit-text-stroke:1px var(--ms-red-dark); position:relative; z-index:1;
}
.cab-base::after {
  content:""; position:absolute; bottom:-8px; left:8%; right:8%; height:8px;
  background:rgba(0,0,0,.5); border-radius:50%; filter:blur(5px);
}

/* ============================================================
   VIEWS (shared)
   ============================================================ */
.view { position:absolute; inset:0; display:flex; flex-direction:column; opacity:0;
  pointer-events:none; transition:opacity 200ms ease-out; }
.view.active { opacity:1; pointer-events:auto; }
#view-boot { align-items:center; justify-content:center; padding:16px; text-align:center; }
.boot-logo { font-family:var(--font-stencil); font-size:clamp(1rem,4vw,2.2rem); line-height:1.1;
  color:var(--ms-yellow); transform:skew(-5deg);
  text-shadow:2px 2px 0 var(--ms-red-deep),3px 3px 0 #000,0 0 20px rgba(255,210,58,.4);
  -webkit-text-stroke:1px var(--ms-red-dark); margin-bottom:22px; letter-spacing:.04em; }
.boot-msgs { font-family:var(--font-crt); font-size:clamp(.9rem,2.3vw,1.25rem); color:var(--neon-green);
  text-align:left; max-width:460px; width:100%; margin-bottom:22px; letter-spacing:.05em; }
.boot-msg { opacity:0; transition:opacity 100ms; }
.boot-msg.shown { opacity:1; }
.boot-msg .ok { color:var(--ms-yellow); }
.loading-bar { width:min(380px,80%); height:16px; border:2px solid var(--ink-dim); background:var(--bg-darker); margin-bottom:22px; }
.loading-fill { height:100%; background:repeating-linear-gradient(90deg,var(--ms-red-bright) 0px,var(--ms-red-bright) 8px,var(--ms-yellow) 8px,var(--ms-yellow) 16px); width:0%; transition:width 80ms linear; }
.press-start { font-family:var(--font-pixel); font-size:clamp(.7rem,2vw,1rem); color:var(--ms-yellow);
  opacity:0; animation:blinkFast .9s steps(2,jump-none) infinite; letter-spacing:.08em; }
.press-start.shown { opacity:1; }
@keyframes blinkFast { 50% { opacity:.2; } }

#view-menu { padding:14px 16px; }
.menu-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:8px;
  border-bottom:2px solid var(--ms-red-bright); margin-bottom:14px; gap:10px; flex-wrap:wrap; }
.menu-title { font-family:var(--font-pixel); font-size:clamp(.6rem,2vw,.95rem);
  color:var(--ms-yellow); text-shadow:2px 2px 0 var(--ms-red-deep); letter-spacing:.05em; }
.menu-hud { font-family:var(--font-crt); font-size:1rem; color:var(--ink-dim);
  letter-spacing:.1em; text-transform:uppercase; display:flex; gap:10px; flex-wrap:wrap; }
.menu-hud .val { color:var(--ms-yellow); }
.menu-hud .credit-blink { color:var(--ms-red-bright); animation:blinkFast 1.1s infinite; }
.menu-body { display:grid; grid-template-columns:1fr; gap:14px; height:calc(100% - 50px); min-height:0; }
@media (min-width:900px) { .menu-body { grid-template-columns:1.4fr 1fr; } }
.cart-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
  align-content:start; overflow-y:auto; padding:4px 4px 4px 0; }
@media (min-width:480px) { .cart-grid { grid-template-columns:repeat(3,1fr); } }
.cart { background:var(--bg-panel); border:2px solid var(--ink-faint); padding:8px 6px 10px;
  position:relative; text-align:center; transition:transform 120ms,border-color 120ms,box-shadow 120ms;
  cursor:pointer; min-height:150px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px; }
.cart-art { width:78px; height:92px; display:flex; align-items:center; justify-content:center; }
.cart-art svg { display:block; max-width:100%; max-height:100%; }
@media (min-width:720px) { .cart-art { width:92px; height:108px; } }
.cart-label { font-family:var(--font-pixel); font-size:.5rem; color:var(--ink-dim);
  line-height:1.4; letter-spacing:.04em; text-transform:uppercase; }
@media (min-width:480px) { .cart-label { font-size:.55rem; } }
.cart.selected { border-color:var(--ms-yellow); background:var(--bg-panel-hi);
  transform:scale(1.05); box-shadow:0 0 0 1px var(--ms-yellow),0 0 22px rgba(255,210,58,.4); }
.cart.selected .cart-label { color:var(--ms-yellow); }
.cart.selected::before,.cart.selected::after { content:""; position:absolute;
  width:11px; height:11px; border:3px solid var(--ms-yellow); }
.cart.selected::before { top:-3px; left:-3px; border-right:none; border-bottom:none; }
.cart.selected::after { bottom:-3px; right:-3px; border-left:none; border-top:none; }
.preview { background:var(--bg-darker); border:2px solid var(--ms-yellow); padding:14px 16px;
  display:flex; flex-direction:column; position:relative; min-height:180px; }
.preview::before { content:"// EQUIP"; position:absolute; top:-10px; left:12px;
  background:var(--bg-screen); padding:0 6px; font-family:var(--font-pixel);
  font-size:.5rem; color:var(--ms-yellow); letter-spacing:.1em; }
.preview-title { font-family:var(--font-pixel); font-size:.75rem; color:var(--ms-yellow);
  line-height:1.4; margin-bottom:10px; text-shadow:2px 2px 0 var(--ms-red-deep); letter-spacing:.04em; }
.preview-desc { font-family:var(--font-crt); font-size:1.05rem; color:var(--ink-dim); line-height:1.45; margin-bottom:10px; }
.preview-meta { margin-top:auto; display:flex; flex-direction:column; gap:3px;
  font-family:var(--font-crt); font-size:1rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }

<script>
function hexToRgb(h){h=h.replace('#','');return{r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
function darker(hex,pct){const c=hexToRgb(hex);const f=1-pct/100;return rgbToHex(Math.round(c.r*f),Math.round(c.g*f),Math.round(c.b*f));}
function lighter(hex,pct){const c=hexToRgb(hex);const f=pct/100;return rgbToHex(
  Math.min(255,Math.round(c.r+(255-c.r)*f)),Math.min(255,Math.round(c.g+(255-c.g)*f)),
  Math.min(255,Math.round(c.b+(255-c.b)*f)));}

function pixelArt(grid, palette, scale, offX, offY) {
  let rects = '';
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const ch = grid[y][x];
      if (ch === '.' || ch === ' ') continue;
      const fill = palette[ch];
      if (!fill) continue;
      rects += `<rect x="${offX + x*scale}" y="${offY + y*scale}" width="${scale}" height="${scale}" fill="${fill}"/>`;
    }
  }
  return rects;
}

/* ============================================================
   AMMO-CRATE PICKUP renderer — original take on the military
   supply-box convention: a gunmetal crate with a colored letter
   panel on the front and the weapon/ammo tucked in a side bay.
   Built from scratch (not ripped sprites).
   ============================================================ */
const CRATE = {
  outline:'#15110a', metal:'#7a7458', metalHi:'#a39a78',
  metalDk:'#4e4a36', bolt:'#2e2b1e', boltHi:'#9a9270'
};
const SIDE_PAL = { 'g':'#8a8366','b':'#b5894e','s':'#d83a2a','w':'#e8e0c0','k':'#15110a','o':'#ff8c1a' };

// Standing rifle cartridges (for H / R / S)
const SIDE_AMMO = [
  '............','.k.k.k.k....','ksksksks....','kbkbkbkb....',
  'kbkbkbkb....','kbkbkbkb....','kbkbkbkb....','kbkbkbkb....',
  '.b.b.b.b....','............','.k.k.k......','ksksks......',
  'kbkbkb......','kbkbkb......','kbkbkb......','kbkbkb......',
  'kbkbkb......','.b.b.b......','............','............',
  '............','............','............','............',
  '............','............','............','............'
];
// Barrel / launcher tube poking out (for C)
const SIDE_BARREL = [
  '............','............','...kkkkkk...','..kgggggk...',
  '.kgwwwwggk..','kgwggggggk..','kggggggggk..','kgggggggk...',
  '.kkkkkkk....','...kggk.....','...kggk.....','...kkkk.....',
  '............','............','............','............',
  '............','............','............','............',
  '............','............','............','............',
  '............','............','............','............'
];
// Fuel canister (for F)
const SIDE_FUEL = [
  '............','....kk......','...koak.....','..kooooak...',
  '..koooooak..','.koooooook..','.kowooooak..','.kooooooak..',
  '.kooooooak..','.kooooooak..','.kooooooak..','.kooooooak..',
  '.kooooooak..','..kooooak...','..kkkkkkk...','............',
  '............','............','............','............',
  '............','............','............','............',
  '............','............','............','............'
];
// Frag grenades stacked (for G)
const SIDE_GREN = [
  '............','............','...kk..kk...','..kggk.kgk..',
  '..kggkkkggk.','.kgggggggk..','.kgwggggwk..','.kgggggggk..',
  '.kgggggggk..','..kgggggk...','...kkkkk....','............',
  '...kk..kk...','..kggkkggk..','.kgggggggk..','.kgwgggwk...',
  '.kgggggggk..','..kkkkkkk...','............','............',
  '............','............','............','............',

];

function pixelArtCustom(grid, palette, scale, offX, offY) {
  let rects = '';
  for (let y = 0; y < grid.length; y++) {
    const row = grid[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      const fill = palette[ch];
      if (!fill) continue;
      rects += `<rect x="${offX + x*scale}" y="${offY + y*scale}" width="${scale}" height="${scale}" fill="${fill}"/>`;
    }
  }
  return rects;
}

function ammoCrate(color, letter, side) {
  const c = CRATE;
  const panelDk = darker(color, 32);
  const panelHi = lighter(color, 30);
  const sideGrid = side === 'ammo' ? SIDE_AMMO : side === 'fuel' ? SIDE_FUEL : side === 'gren' ? SIDE_GREN : SIDE_BARREL;
  return `<svg viewBox="0 0 60 72" width="100%" height="100%" shape-rendering="crispEdges">
    <rect x="8" y="61" width="44" height="2" fill="rgba(0,0,0,.45)"/>
    <rect x="11" y="63" width="38" height="1" fill="rgba(0,0,0,.3)"/>
    <rect x="5" y="7" width="50" height="54" fill="${c.outline}"/>
    <rect x="7" y="9" width="46" height="50" fill="${c.metal}"/>
    <rect x="7" y="9" width="46" height="2" fill="${c.metalHi}"/>
    <rect x="7" y="9" width="2" height="50" fill="${c.metalHi}"/>
    <rect x="7" y="57" width="46" height="2" fill="${c.metalDk}"/>
    <rect x="51" y="9" width="2" height="50" fill="${c.metalDk}"/>
    <rect x="9" y="11" width="4" height="4" fill="${c.bolt}"/><rect x="10" y="12" width="2" height="2" fill="${c.boltHi}"/>
    <rect x="47" y="11" width="4" height="4" fill="${c.bolt}"/><rect x="48" y="12" width="2" height="2" fill="${c.boltHi}"/>
    <rect x="9" y="53" width="4" height="4" fill="${c.bolt}"/><rect x="10" y="54" width="2" height="2" fill="${c.boltHi}"/>
    <rect x="47" y="53" width="4" height="4" fill="${c.bolt}"/><rect x="48" y="54" width="2" height="2" fill="${c.boltHi}"/>
    <rect x="24" y="5" width="12" height="3" fill="${c.outline}"/>
    <rect x="25" y="6" width="10" height="1" fill="${c.metalHi}"/>
    <rect x="37" y="13" width="2" height="38" fill="${c.metalDk}"/>
    <rect x="11" y="15" width="25" height="34" fill="${c.outline}"/>
    <rect x="12" y="16" width="23" height="32" fill="${color}"/>
    <rect x="12" y="16" width="23" height="2" fill="${panelHi}"/>
    <rect x="12" y="46" width="23" height="2" fill="${panelDk}"/>
    <rect x="13" y="17" width="1" height="1" fill="${panelDk}"/>
    <rect x="33" y="17" width="1" height="1" fill="${panelDk}"/>
    <rect x="13" y="45" width="1" height="1" fill="${panelDk}"/>
    <rect x="33" y="45" width="1" height="1" fill="${panelDk}"/>
    <text x="23.5" y="39" text-anchor="middle" shape-rendering="auto" font-family="'Press Start 2P',monospace" font-size="15" fill="${c.outline}" opacity="0.85" transform="translate(1,1)">${letter}</text>
    <text x="23.5" y="39" text-anchor="middle" shape-rendering="auto" font-family="'Press Start 2P',monospace" font-size="15" fill="${lighter(color,55)}">${letter}</text>
    <rect x="40" y="15" width="11" height="34" fill="${darker(c.metal,28)}"/>
    <rect x="40" y="15" width="11" height="1" fill="${c.metalDk}"/>
    ${pixelArtCustom(sideGrid, SIDE_PAL, 0.92, 39.5, 16)}
  </svg>`;
}

function weaponPickup(color, letter, side) { return ammoCrate(color, letter, side); }

/* ============================================================
   DATA — sections as weapon pickups
   ============================================================ */
const cartridges = [
  { id:'blog',        label:'Playing\nwith Packets', title:'HEAVY MACHINE GUN', sub:'PLAYING WITH PACKETS', desc:'The main blog — your rapid-fire output. Detection writeups, threat research, project updates.', meta:[['WEAPON','[H] HMG'],['POSTS','42'],['LATEST','2026.05.28']], color:'#ffd23a', side:'ammo', letter:'H' },
  { id:'chokepoints', label:'Detection\nChokepoints', title:'ROCKET LAUNCHER', sub:'DETECTION CHOKEPOINTS', desc:'The heavy framework. Behavior-first detection — what must be true regardless of tooling.', meta:[['WEAPON','[R] ROCKET'],['STACK','JEKYLL'],['STATUS','LIVE']], color:'#e8352a', side:'ammo', letter:'R' },
  { id:'tacklebox',   label:'Tacklebox',              title:'FLAME SHOT',       sub:'TACKLEBOX',             desc:'AiTM phishing kit TTP emulation — burns down adversary kits in controlled environments.', meta:[['WEAPON','[F] FLAME'],['STACK','PYTHON'],['STATUS','BETA']], color:'#ff8c1a', side:'fuel', letter:'F' },
  { id:'iok',         label:'IOK\nDetection Lab',     title:'ENEMY CHASER',     sub:'IOK DETECTION LAB',     desc:'Homing on targets. Phishing kit hunting — Playwright scraping, ProtonVPN, Sigma matching.', meta:[['WEAPON','[C] CHASER'],['STACK','PYTHON'],['STATUS','LIVE']], color:'#8ab43a', side:'barrel', letter:'C' },
  { id:'podcast',     label:'Detection\nLab Podcast', title:'SHOTGUN',          sub:'DETECTION LAB PODCAST', desc:'Close-range conversations on threat hunting and detection engineering.', meta:[['WEAPON','[S] SHOTGUN'],['STATUS','SOON']], color:'#d8488e', side:'ammo', letter:'S' },
  { id:'about',       label:'About\nPlayer 1',        title:'SUPER GRENADE',    sub:'ABOUT PLAYER 1',        desc:'Tyler Bohlmann. Detection engineer at Huntress. Coffee, whisky, jiu-jitsu, threat hunting.', meta:[['WEAPON','[G] GRENADE'],['ORG','HUNTRESS']], color:'#4a9ec4', side:'gren', letter:'G' }
];
function cartSvgFor(cart) { return weaponPickup(cart.color, cart.letter, cart.side); }

let view = 'boot', selected = 0, cols = 2, activeShell = null;
function isGbShell() {
  if (document.body.classList.contains('force-gb')) return true;
  if (document.body.classList.contains('force-arcade')) return false;
  return window.matchMedia('(max-width: 719px)').matches;
}
function mountScreen() {
  const wantsGb = isGbShell();
  const wants = wantsGb ? 'gb' : 'arcade';
  if (wants === activeShell) return;
  activeShell = wants;
  const target = wantsGb ? document.getElementById('gb-screen') : document.getElementById('cab-screen');
  document.getElementById('gb-screen').innerHTML = '';
  document.getElementById('cab-screen').innerHTML = '';
  const tpl = document.getElementById('screen-template').content.cloneNode(true);
  target.appendChild(tpl);
  target.querySelector('.back-btn').addEventListener('click', goBack);
  if (view === 'boot') runBoot();
  else if (view === 'menu') { showView('menu'); renderGrid(); renderPreview(); }
  else { showView('detail'); renderDetail(cartridges[selected]); }
}
function $(sel) { const root = activeShell === 'gb' ? document.getElementById('gb-screen') : document.getElementById('cab-screen'); return root ? root.querySelector(sel) : null; }
function $$(sel) { const root = activeShell === 'gb' ? document.getElementById('gb-screen') : document.getElementById('cab-screen'); return root ? root.querySelectorAll(sel) : []; }

const bootLines = [
  '[<span class="ok">OK</span>] SYSTEM POWER ON',
  '[<span class="ok">OK</span>] LOADING DETECTION ROM v6.1',
  '[<span class="ok">OK</span>] ARMORY INITIALIZED',
  '[<span class="ok">OK</span>] MISSION READY'
];
function runBoot() {
  const msgs = $('.boot-msgs'); const fill = $('.loading-fill');
  if (!msgs || !fill) return;
  msgs.innerHTML = bootLines.map(l => `<div class="boot-msg">${l}</div>`).join('');
  const lines = msgs.querySelectorAll('.boot-msg');
  let i = 0;
  const li = setInterval(() => { if (i >= lines.length) { clearInterval(li); return; } lines[i].classList.add('shown'); i++; }, 260);
  let pct = 0;
  const fi = setInterval(() => { pct += 3; if (pct >= 100) { pct = 100; clearInterval(fi); } fill.style.width = pct + '%'; }, 50);
  setTimeout(() => { const ps = $('.press-start'); if (ps) ps.classList.add('shown'); }, 1500);
}
function renderGrid() {
  const grid = $('.cart-grid'); if (!grid) return;
  grid.innerHTML = cartridges.map((c, i) => `
    <div class="cart ${i === selected ? 'selected' : ''}" data-idx="${i}">
      <div class="cart-art">${cartSvgFor(c)}</div>
      <div class="cart-label">${c.label.replace(/\n/g, '<br>')}</div>
    </div>`).join('');
  grid.querySelectorAll('.cart').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      if (idx === selected) loadCartridge();
      else { selected = idx; renderGrid(); renderPreview(); }
    });
  });
}
function renderPreview() {
  const c = cartridges[selected];
  const t = $('.preview-title'); if (t) t.innerHTML = c.title + '<br><span style="font-size:.55rem;color:var(--ink-dim)">' + c.sub + '</span>';
  const d = $('.preview-desc');  if (d) d.textContent = c.desc;
  const m = $('.preview-meta');  if (m) m.innerHTML = c.meta.map(([k,v]) => `<div>${k}: <b>${v}</b></div>`).join('');
}
function recalcCols() { const grid = $('.cart-grid'); if (!grid) return; cols = grid.clientWidth >= 460 ? 3 : 2; }
function move(dir) {
  if (view !== 'menu') return;
  recalcCols(); const n = cartridges.length; let next = selected;
  if (dir === 'left')  next = (selected % cols === 0) ? selected : selected - 1;
  if (dir === 'right') next = ((selected + 1) % cols === 0 || selected + 1 >= n) ? selected : selected + 1;
  if (dir === 'up')    next = (selected - cols < 0) ? selected : selected - cols;
  if (dir === 'down')  next = (selected + cols >= n) ? selected : selected + cols;
  if (next !== selected) { selected = next; renderGrid(); renderPreview(); }
}
function loadCartridge() { if (view !== 'menu') return; flash(); setTimeout(() => { showView('detail'); renderDetail(cartridges[selected]); }, 180); }
function flash() { const f = $('.flash'); if (!f) return; f.classList.remove('fire'); void f.offsetWidth; f.classList.add('fire'); }

const detailContent = {
  blog: `<h3>Recent Transmissions</h3>
    <div class="post-row"><span class="num">#42</span><span class="title">ClickFix Variant Coverage Map</span><span class="date">2026.05.28</span></div>
    <div class="post-row"><span class="num">#41</span><span class="title">Lynx Ransomware: DFIR Walkthrough</span><span class="date">2026.05.14</span></div>
    <div class="post-row"><span class="num">#40</span><span class="title">IOK Detection Lab: Hunting at Scale</span><span class="date">2026.04.22</span></div>`,
  chokepoints: `<h3>Mission Brief</h3><p>Behavior-first detection framework. Documents what must be true regardless of tooling.</p>`,
  tacklebox: `<h3>Mission Brief</h3><p>AiTM phishing kit emulation framework for purple teams.</p>`,
  iok: `<h3>Mission Brief</h3><p>Phishing kit hunting tool. Playwright scraping, ProtonVPN, Sigma matching.</p>`,
  podcast: `<h3>Coming Soon</h3><p>Conversations on threat hunting and detection engineering.</p>`,
  about: `<h3>Player 1</h3><p>Detection engineer at Huntress.</p>`
};
function renderDetail(c) { const t = $('.detail-title'); if (t) t.textContent = c.sub; const b = $('.detail-body'); if (b) b.innerHTML = detailContent[c.id] || '<p>Coming soon…</p>'; }
function showView(name) { $$('.view').forEach(v => v.classList.remove('active')); const v = $('#view-' + name); if (v) v.classList.add('active'); view = name; }
function startGame() { if (view !== 'boot') return; showView('menu'); renderGrid(); renderPreview(); }
function goBack() { if (view === 'detail') { flash(); setTimeout(() => showView('menu'), 100); } }
function handleAction(action) {
  if (action === 'select') { if (view === 'boot') startGame(); else if (view === 'menu') loadCartridge(); }
  if (action === 'back')   { if (view === 'detail') goBack(); }
}
document.addEventListener('keydown', (e) => {
  if (view === 'boot') { e.preventDefault(); startGame(); return; }
  if (view === 'menu') {
    if (e.key === 'ArrowUp')    { e.preventDefault(); move('up'); }
    if (e.key === 'ArrowDown')  { e.preventDefault(); move('down'); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); move('left'); }
    if (e.key === 'ArrowRight') { e.preventDefault(); move('right'); }
    if (e.key === 'Enter' || e.key.toLowerCase() === 'z') { e.preventDefault(); loadCartridge(); }
  }
  if (view === 'detail') {
    if (e.key === 'Escape' || e.key.toLowerCase() === 'x') { e.preventDefault(); goBack(); }
  }
});
document.querySelectorAll('[data-dir]').forEach(b => { b.addEventListener('click', (e) => { e.preventDefault(); move(b.dataset.dir); }); });
document.querySelectorAll('[data-action]').forEach(b => { b.addEventListener('click', (e) => { e.preventDefault(); handleAction(b.dataset.action); }); });
document.getElementById('shell-toggle').addEventListener('click', () => {
  const body = document.body;
  const current = body.classList.contains('force-gb') ? 'gb' : body.classList.contains('force-arcade') ? 'arcade' : (isGbShell() ? 'gb' : 'arcade');
  body.classList.remove('auto', 'force-gb', 'force-arcade');
  body.classList.add(current === 'gb' ? 'force-arcade' : 'force-gb');
  activeShell = null; mountScreen();
});

mountScreen();
window.addEventListener('resize', () => { mountScreen(); recalcCols(); });
</script>
</body>
</html>
