<div class="gba-shell">
  <div class="gba-chassis">
    <div class="gba-shoulder-l">L</div>
    <div class="gba-shoulder-r">R</div>

    <div class="gba-left-grip">
      <div class="gba-dpad-wrap">
        <div class="gba-dpad-cross h"></div><div class="gba-dpad-cross v"></div>
        <button class="gba-dpad-btn up" data-dir="up">▲</button>
        <button class="gba-dpad-btn down" data-dir="down">▼</button>
        <button class="gba-dpad-btn left" data-dir="left">◀</button>
        <button class="gba-dpad-btn right" data-dir="right">▶</button>
      </div>
    </div>

    <div class="gba-body">
      <div class="gba-top-bar">
        <div class="gba-led-row"><div class="gba-led"></div><span>POWER</span></div>
        <div class="gba-wordmark">playingwithpackets</div>
      </div>
      <div class="gba-screen-bezel">
        <div id="gba-screen"></div>
      </div>
      <div class="gba-startsel">
        <div class="gba-startsel-col"><button class="gba-btn-pill" data-action="back"></button><div class="gba-btn-label">SELECT</div></div>
        <div class="gba-startsel-col"><button class="gba-btn-pill" data-action="select"></button><div class="gba-btn-label">START</div></div>
      </div>
    </div>

    <div class="gba-right-grip">
      <div class="gba-btn-cluster">
        <div class="gba-ab-wrap">
          <div class="gba-ab-col"><button class="gba-btn-ab" data-action="back">B</button><div class="gba-btn-label">B</div></div>
          <div class="gba-ab-col"><button class="gba-btn-ab" data-action="select">A</button><div class="gba-btn-label">A</div></div>
        </div>
      </div>
      <div class="gba-speaker"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>

  </div>
</div>
